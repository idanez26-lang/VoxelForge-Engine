# CI VoxelForge Engine — build Debug + suite CTest complète sur Windows.
# Se déclenche sur chaque push de branche de travail et sur les pull requests.
name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'experiment/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-debug:
    name: Windows Debug (MSVC + Ninja)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environnement MSVC (cl.exe dans le PATH)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # SDL3 et Dear ImGui sont téléchargés par FetchContent au configure :
      # on met leurs sources en cache pour éviter de re-cloner à chaque run.
      - name: Cache des dépendances FetchContent
        uses: actions/cache@v4
        with:
          path: build/windows-debug/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configuration (preset windows-debug)
        run: cmake --preset windows-debug

      - name: Build
        run: cmake --build --preset build-windows-debug

      # Les tests étiquetés "EditorApp" lancent l'éditeur complet et exigent
      # un rendu GPU réel — indisponible sur les runners GitHub (D3D12 logiciel
      # sans frame). Ils tournent en étape séparée, non bloquante.
      - name: Tests (bloquants — tout sauf l'application GUI)
        run: ctest --test-dir build/windows-debug --output-on-failure --timeout 120 --label-exclude EditorApp

      - name: Tests de l'application (GPU requis — non bloquants sur runner)
        continue-on-error: true
        env:
          # Rendu logiciel WARP lent : budget de frames des smokes x5
          # (diagnostic 03/08 — 23 smokes en "did not complete" a x1).
          VOXELFORGE_SMOKE_FRAME_SCALE: 5
        run: ctest --test-dir build/windows-debug --output-on-failure --timeout 120 --label-regex EditorApp

      - name: Journaux CTest en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs
          path: build/windows-debug/Testing/Temporary/
          if-no-files-found: ignore
